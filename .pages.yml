# Pages CMS configuration — https://pagescms.org
#
# HOW TO USE
#   1. Go to https://app.pagescms.org and sign in with GitHub.
#   2. Grant access to the `aguycalledpaul/henrypall.com` repository.
#   3. The collections below appear as an editing UI.
#   Saving in the CMS writes a commit to `main`, which triggers the site
#   rebuild + FTP deploy automatically (usually live within ~1 minute).
#
# Images uploaded in the CMS are stored in `public/uploads` and served
# from `/beta/uploads/...`.

media:
  input: public/uploads
  output: /beta/uploads
  extensions: [jpg, jpeg, png, gif, webp, svg, avif]

content:
  # ===================== PAGES (static page content) =====================
  - name: page-home
    label: "Page · Home"
    type: file
    path: src/content/home.json
    format: json
    fields:
      - name: hero
        label: Hero carousel
        type: object
        list: true
        fields:
          - { name: category, label: Category, type: string }
          - { name: date, label: Date, type: string }
          - { name: title, label: Title, type: string }
          - { name: excerpt, label: Excerpt, type: text }
          - { name: image, label: Image, type: image }
          - { name: focus, label: Focus (which part of the image to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
          - { name: link, label: Link, type: string }
      - name: newsletter
        label: Newsletter block
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: subtitle, label: Subtitle, type: text }
          - { name: buttonLabel, label: Button label, type: string }
      - name: categories
        label: Category tiles
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: image, label: Image, type: image }
          - { name: focus, label: Focus (which part of the image to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
          - { name: link, label: Link, type: string }
      - name: about
        label: About teaser
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: image, label: Image, type: image }
          - { name: focus, label: Focus (which part of the image to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
          - { name: ctaLink, label: Button link, type: string }
      - name: fieldNotes
        label: Field Notes teaser
        type: object
        fields:
          - { name: watermark, label: Watermark word, type: string }
          - { name: quote, label: Quote, type: text }
          - name: notes
            label: Note cards
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string }
              - { name: date, label: Date, type: string }
              - { name: image, label: Image, type: image }
              - { name: focus, label: Focus (which part of the image to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
              - { name: link, label: Link, type: string }
      - name: lectures
        label: Lectures teaser
        type: object
        fields:
          - { name: label, label: Label, type: string }
          - name: items
            label: Lecture cards
            type: object
            list: true
            fields:
              - { name: category, label: Category, type: string }
              - { name: title, label: Title, type: string }
              - { name: image, label: Image, type: image }
              - { name: focus, label: Focus (which part of the image to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
              - { name: link, label: Link, type: string }

  - name: page-books
    label: "Page · Books"
    type: file
    path: src/content/books.json
    format: json
    fields:
      - name: hero
        label: Featured book (hero)
        type: object
        fields:
          - { name: coverImage, label: Cover image, type: image }
          - { name: coverFocus, label: Cover focus (which part to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
          - { name: title, label: Title, type: string }
          - { name: subtitle, label: Subtitle, type: string }
          - { name: desc, label: Description, type: text }
          - { name: lastLine, label: Closing line, type: string }
      - name: actions
        label: Action buttons
        type: object
        list: true
        fields:
          - { name: label, label: Label (first word is bold), type: string }
          - { name: link, label: Link, type: string }
      - name: intro
        label: Introduction
        type: object
        fields:
          - { name: image, label: Image, type: image }
          - { name: focus, label: Focus (which part of the image to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
          - { name: quote, label: "Quote (HTML allowed, e.g. <i>...</i>)", type: text }
      - name: copy1
        label: Body text (first block, two columns)
        type: object
        fields:
          - { name: colA, label: Left column, type: text }
          - { name: colB, label: Right column, type: text }
      - name: feature
        label: Second feature
        type: object
        fields:
          - { name: image, label: Image, type: image }
          - { name: focus, label: Focus (which part of the image to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
          - { name: title, label: Title, type: string }
      - { name: kicker, label: Kicker headline, type: string }
      - name: copy2
        label: Body text (second block, two columns)
        type: object
        fields:
          - { name: colA, label: Left column, type: text }
          - { name: colB, label: Right column, type: text }
      - name: newsletter
        label: Newsletter bar
        type: object
        fields:
          - { name: label, label: "Label (HTML allowed)", type: string }
          - { name: joinLabel, label: Button label, type: string }

  - name: page-curiously-polar
    label: "Page · Curiously Polar"
    type: file
    path: src/content/curiously-polar.json
    format: json
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: backgroundImage, label: Background image, type: image }
          - { name: backgroundFocus, label: Background focus, type: select, options: { values: [center, top, bottom, left, right] }, default: center }
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: line1, label: Headline line 1, type: string }
          - { name: line2, label: Headline line 2, type: string }
          - name: buttons
            label: Buttons
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: link, label: Link, type: string }
      - name: middle
        label: Quote & motto
        type: object
        fields:
          - { name: image, label: Image, type: image }
          - { name: focus, label: Focus (which part of the image to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
          - { name: quote, label: Quote, type: text }
          - { name: moreLabel, label: "Read-more button (first word bold)", type: string }
          - { name: moreLink, label: Read-more link, type: string }
          - { name: motto, label: "Motto (HTML: use <br /> for line breaks)", type: text }
          - { name: mottoAuthor, label: Motto author, type: string }
      - name: newsletter
        label: Newsletter block
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: titleLine1, label: "Title line 1 (HTML: <span class=\"cpnews__hl\">…</span> highlights)", type: string }
          - { name: titleLine2, label: Title line 2, type: string }
          - { name: titleLine3, label: "Title line 3 (HTML highlights allowed)", type: string }
          - { name: sub, label: Subtitle, type: text }
          - { name: joinLabel, label: Button label, type: string }

  - name: page-podcast
    label: "Page · Podcast"
    type: file
    path: src/content/podcast.json
    format: json
    fields:
      - name: story
        label: Podcast story
        type: object
        fields:
          - { name: heroImage, label: Hero image, type: image }
          - { name: heroFocus, label: Hero focus (which part to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
          - { name: headline, label: "Headline (HTML: use <br /> for line breaks)", type: string }
          - { name: intro1, label: Intro paragraph 1, type: text }
          - { name: intro2, label: Intro paragraph 2, type: text }
          - { name: bodyA, label: Body paragraph 1, type: text }
          - { name: bodyB, label: Body paragraph 2, type: text }
      - name: team
        label: The team
        type: object
        fields:
          - { name: quote, label: Quote, type: text }
          - name: members
            label: Team members
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string }
              - { name: image, label: Photo, type: image }
              - { name: focus, label: Focus (which part of the photo to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
      - name: gallery
        label: Gallery photos
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image }
          - { name: focus, label: Focus (which part of the photo to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
  - name: page-newsletter
    label: "Page · Newsletter"
    type: file
    path: src/content/newsletter.json
    format: json
    fields:
      - name: journalForm
        label: "Journal signup form"
        type: object
        fields:
          - { name: title, label: "Title (HTML: use <br /> for line breaks)", type: string }
          - { name: text, label: Text, type: text }
          - { name: button, label: Button label, type: string }
      - name: bookForm
        label: "Book-update signup form"
        type: object
        fields:
          - { name: coverImage, label: Book cover image, type: image }
          - { name: coverFocus, label: Cover focus, type: select, options: { values: [center, top, bottom, left, right] }, default: center }
          - { name: cta, label: "Call to action (HTML allowed, e.g. <i>...</i>)", type: string }
          - { name: button, label: Button label, type: string }
      - name: band
        label: "Curiously Polar band"
        type: object
        fields:
          - { name: label, label: Section label, type: string }
          - { name: logo, label: Logo image, type: image }
          - { name: title, label: "Title (HTML: use <br /> for line breaks)", type: string }
          - { name: text, label: Text, type: text }
          - { name: button, label: Button label, type: string }

  - name: page-dispatches
    label: "Page · Dispatches (intro + featured)"
    type: file
    path: src/content/dispatches.json
    format: json
    fields:
      - name: intro
        label: Intro
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: text }
      - name: featured
        label: Featured dispatch
        type: object
        fields:
          - { name: category, label: Category, type: string }
          - { name: date, label: Date, type: string }
          - { name: title, label: Title, type: string }
          - { name: excerpt, label: Excerpt, type: text }
          - { name: image, label: Image, type: image }
          - { name: focus, label: Focus (which part of the image to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
          - { name: link, label: Link, type: string }
  - name: page-field-notes
    label: "Page · Field Notes (intro + featured)"
    type: file
    path: src/content/field-notes.json
    format: json
    fields:
      - name: intro
        label: Intro
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: text }
      - name: featured
        label: Latest field note
        type: object
        fields:
          - { name: date, label: Date, type: string }
          - { name: location, label: Location, type: string }
          - { name: title, label: Title, type: string }
          - { name: image, label: Image, type: image }
          - { name: focus, label: Focus (which part of the image to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
          - { name: link, label: Link, type: string }
  - name: page-lectures
    label: "Page · Lectures (intro + featured)"
    type: file
    path: src/content/lectures.json
    format: json
    fields:
      - name: intro
        label: Intro
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: text }
      - name: featured
        label: Featured lecture
        type: object
        fields:
          - { name: category, label: Category, type: string }
          - { name: title, label: Title, type: string }
          - { name: excerpt, label: Excerpt, type: text }
          - { name: image, label: Image, type: image }
          - { name: focus, label: Focus (which part of the image to keep in view), type: select, options: { values: [center, top, bottom, left, right] }, default: center }
          - { name: link, label: Link, type: string }
  # ===================== NEWSLETTERS =====================
  - name: nl-journal
    label: "Newsletter · Journal"
    type: collection
    path: src/newsletters/journal
    filename: "{fields.date}.md"
    view:
      fields: [title, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: date, label: "Date (also the file name)", type: date, required: true }
      - { name: displayDate, label: "Display date", type: string, description: "How the date reads on the page, e.g. July 31, 2026" }
      - { name: title, label: Title, type: string, required: true }
      - { name: cover, label: Header image, type: image }
      - { name: excerpt, label: Excerpt, type: text }
      - { name: list, label: List, type: string, default: journal, description: "Keep as 'journal'" }
      - { name: body, label: Content, type: rich-text }

  - name: nl-ice-in-practice
    label: "Newsletter · Ice in Practice"
    type: collection
    path: src/newsletters/ice-in-practice
    filename: "{fields.date}.md"
    view:
      fields: [title, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: date, label: "Date (also the file name)", type: date, required: true }
      - { name: displayDate, label: "Display date", type: string, description: "e.g. July 20, 2026" }
      - { name: title, label: Title, type: string, required: true }
      - { name: cover, label: Header image, type: image }
      - { name: excerpt, label: Excerpt, type: text }
      - { name: list, label: List, type: string, default: ice-in-practice, description: "Keep as 'ice-in-practice'" }
      - { name: body, label: Content, type: rich-text }

  - name: nl-narrating-the-poles
    label: "Newsletter · Narrating the Poles"
    type: collection
    path: src/newsletters/narrating-the-poles
    filename: "{fields.date}.md"
    view:
      fields: [title, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: date, label: "Date (also the file name)", type: date, required: true }
      - { name: displayDate, label: "Display date", type: string, description: "e.g. July 30, 2026" }
      - { name: title, label: Title, type: string, required: true }
      - { name: cover, label: Header image, type: image }
      - { name: excerpt, label: Excerpt, type: text }
      - { name: list, label: List, type: string, default: narrating-the-poles, description: "Keep as 'narrating-the-poles'" }
      - { name: body, label: Content, type: rich-text }

  # ===================== DISPATCHES =====================
  - name: dispatches
    label: Dispatches
    type: collection
    path: src/dispatches
    filename: "{fields.slug}.md"
    view:
      fields: [title, category, date, featured]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: slug, label: "URL slug", type: string, required: true, description: "Short file name, e.g. thin-ice → /beta/dispatches/thin-ice. Don't change it after publishing." }
      - { name: title, label: Title, type: string, required: true }
      - { name: category, label: Category, type: string }
      - { name: date, label: Date, type: date, required: true }
      - { name: excerpt, label: Excerpt, type: text }
      - { name: cover, label: Cover image, type: image }
      - { name: featured, label: Featured, type: boolean, default: false }
      - { name: readingTime, label: Reading time, type: string, description: "e.g. approx. 20 minutes" }
      - { name: doi, label: DOI, type: string }
      - { name: pdf, label: PDF path, type: string, description: "e.g. /pdfs/thin-ice.pdf" }
      - name: references
        label: References
        type: object
        list: true
        fields:
          - { name: text, label: Citation, type: text, required: true }
          - { name: url, label: URL, type: string }
      - name: figures
        label: Figure captions
        type: object
        list: true
        fields:
          - { name: caption, label: Caption, type: text }
          - { name: source, label: Source / credit, type: string }
      - name: resources
        label: Further resources
        type: object
        list: true
        fields:
          - { name: text, label: Label, type: string, required: true }
          - { name: url, label: URL, type: string }
      - { name: body, label: Content (Markdown / HTML), type: code, options: { language: markdown } }

  # ===================== LECTURES =====================
  - name: lectures
    label: Lectures
    type: collection
    path: src/lectures
    filename: "{fields.slug}.md"
    view:
      fields: [title, category, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: slug, label: "URL slug", type: string, required: true, description: "Short file name, e.g. pancakes-breccia-neve. Don't change it after publishing." }
      - { name: title, label: Title, type: string, required: true }
      - { name: subtitle, label: Subtitle, type: string }
      - { name: category, label: Category, type: string }
      - { name: date, label: Date, type: date, required: true }
      - { name: excerpt, label: Excerpt, type: text }
      - { name: cover, label: Cover image, type: image }
      - { name: readingTime, label: Reading time, type: string }
      - { name: body, label: Content (Markdown / HTML), type: code, options: { language: markdown } }
